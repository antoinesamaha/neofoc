name: Deploy Maven Package

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set dynamic version
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "VERSION=1.0.0" >> $GITHUB_ENV
          else
            echo "VERSION=1.0.0-SNAPSHOT" >> $GITHUB_ENV
          fi

      - name: Build project
        run: mvn clean package -Dneofocversion=${{ env.VERSION }} --settings .mvn/settings.xml

      - name: Publish to GitHub Packages
        run: mvn deploy -Dneofocversion=${{ env.VERSION }} --settings .mvn/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (only on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

